<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Onboarding and Enablement Hub</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="alternate icon" href="assets/favicon.png" />
<style>
  @font-face{font-family:"Tiempos Text";src:url("fonts/tiempos-text-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:"Tiempos Text";src:url("fonts/tiempos-text-regular-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap;}
  @font-face{font-family:"National 2";src:url("fonts/national-2-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:"National 2";src:url("fonts/national-2-regular-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap;}
  @font-face{font-family:"National 2";src:url("fonts/national-2-bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:"National 2";src:url("fonts/national-2-bold-italic.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap;}

  :root{
    --graphite:#1E1E1E; --white:#FFFFFF; --paper:#F7F4EF; --sand:#EEE7D7;
    --ink:#544946; --orange:#FF551D; --blue:#2354FF; --ivory:#E1DFDB;
    --serif:"Tiempos Text",Georgia,serif; --sans:"National 2",Arial,sans-serif;
    /* Status tokens drawn from the brand palette only. */
    --ok:#1E1E1E; --warn:#544946; --err:#FF551D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans); color:var(--graphite); background:var(--paper);
    line-height:1.55; letter-spacing:-0.02em; -webkit-font-smoothing:antialiased;}
  h1,h2,.serif{font-family:var(--serif); letter-spacing:-0.02em; font-weight:400;}
  h3,h4,h5{font-family:var(--sans); font-weight:700; letter-spacing:-0.02em;}
  a{color:var(--blue); text-decoration:none;} a:hover{text-decoration:underline;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:1160px; margin:0 auto; padding:0 26px;}
  .jwrap{max-width:1560px; margin:0 auto; padding:0 30px;}
  .eyebrow{font-size:12.5px; color:var(--ink); margin:0 0 10px;}

  .btn-primary{background:var(--blue); color:var(--white); border:none; border-radius:8px;
    padding:12px 22px; font-size:14.5px; font-weight:700;}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-ghost{background:var(--white); color:var(--graphite); border:1px solid var(--ink);
    border-radius:8px; padding:11px 18px; font-size:14px; font-weight:700;}
  .btn-ghost:disabled{opacity:.4; cursor:not-allowed;}

  /* Testing notice */
  .testbar{background:var(--graphite); color:var(--white); text-align:center; font-size:12.5px; padding:8px 16px;}
  .gate-test{background:var(--sand); border-left:3px solid var(--orange); border-radius:8px;
    padding:12px 14px; font-size:13px; color:var(--graphite); margin:0 0 18px; line-height:1.5;}

  /* Top bar */
  .topbar{position:sticky; top:0; z-index:40; background:var(--white); border-bottom:1px solid var(--ivory);}
  .topbar .inner{max-width:1560px; margin:0 auto; padding:14px 30px; display:flex; align-items:center; gap:16px;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .mark{font-size:14px; font-weight:700; padding-right:14px; border-right:1px solid var(--ivory);}
  .brand .prod .n{font-size:16px; font-weight:700; line-height:1.15;}
  .brand .prod .s{font-size:12px; color:var(--ink);}
  .topbar .spacer{flex:1;}
  .role-chip{display:none; font-size:12.5px; color:var(--ink); background:var(--sand); border-radius:999px; padding:5px 12px;}
  body[data-screen="journey"] .role-chip, body[data-screen="done"] .role-chip{display:inline-flex;}
  .tlink{font-size:13.5px;}
  .lrs-badge{display:none; align-items:center; gap:10px; font-size:12px; padding:5px 12px;
    border:1px solid var(--ivory); border-radius:999px; background:var(--white);}
  .lrs-badge .lrs-dot{width:9px; height:9px; border-radius:50%; background:var(--ivory); flex:none;}
  .lrs-badge.live .lrs-dot{background:var(--ok);} .lrs-badge.sending .lrs-dot{background:var(--warn);}
  .lrs-badge.error .lrs-dot{background:var(--err);}
  .lrs-badge .lrs-status{font-weight:700;}
  .lrs-badge .lrs-email{color:var(--ink); border-left:1px solid var(--ivory); padding-left:10px;
    max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lrs-badge .lrs-count{color:var(--ink);}

  /* Gate */
  .gate-wrap{min-height:64vh; display:grid; place-items:center; padding:48px 0;}
  .gate{max-width:480px; width:100%; background:var(--white); border:1px solid var(--ivory); border-radius:14px; padding:38px 34px;}
  .gate h1{font-size:32px; margin:6px 0 0;}
  .gate .rule{width:52px; height:3px; background:var(--orange); margin:14px 0 16px; border-radius:2px;}
  .gate p{font-size:14.5px; color:var(--ink); margin:0 0 20px;}
  .gate-form{display:flex; gap:10px; flex-wrap:wrap;}
  .gate-form input{flex:1; min-width:220px; padding:12px 14px; border:1px solid var(--ink); border-radius:8px;
    font-family:inherit; font-size:14.5px; background:var(--white); color:var(--graphite);}
  .gate-err{color:var(--err); font-size:13px; margin:12px 0 0; display:none;} .gate-err.show{display:block;}
  .gate-note{font-size:12px; color:var(--ink); margin:18px 0 0; line-height:1.5;}

  /* Landing */
  .landing{padding:36px 0 54px;}
  .landing .hero{max-width:720px;}
  .landing h1{font-size:40px; line-height:1.1; margin:8px 0 0;} .landing h1 em{font-style:italic;}
  .landing .rule{width:60px; height:3px; background:var(--orange); margin:16px 0 18px; border-radius:2px;}
  .landing .lede{font-size:17px; color:var(--ink); margin:0; max-width:60ch;}
  .cards{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:30px 0 0;}
  .card{background:var(--white); border:1px solid var(--ivory); border-radius:14px; padding:20px 22px;
    display:flex; flex-direction:column; gap:9px; transition:box-shadow .15s, transform .15s;}
  .card:hover{box-shadow:0 8px 26px rgba(30,30,30,.08); transform:translateY(-2px);}
  .card h3{margin:0; font-size:18.5px;} .card .who{font-size:13.5px; color:var(--ink); margin:0; line-height:1.45;}
  .card ul{margin:0; padding-left:17px; font-size:13.5px; color:var(--ink);} .card ul li{margin:3px 0; line-height:1.45;}
  .card .go{margin-top:auto; align-self:flex-start;}

  /* Journey: wide, center-dominant, side panels pushed out */
  .journey{display:grid; grid-template-columns:220px minmax(0,1fr) 250px; gap:46px;
    padding:34px 0 72px; align-items:start;}
  .rail{background:var(--white); border:1px solid var(--ivory); border-radius:14px; padding:22px; position:sticky; top:82px;}
  .rail .rtitle{font-size:15px; font-weight:700; margin:0 0 2px;} .rail .rmeta{font-size:12.5px; color:var(--ink); margin:0 0 14px;}
  .bar{height:6px; background:var(--sand); border-radius:999px; overflow:hidden; margin-bottom:18px;}
  .bar > span{display:block; height:100%; background:var(--orange); transition:width .25s;}
  .steps{list-style:none; margin:0; padding:0;}
  .steps li{display:flex; gap:12px; align-items:flex-start; padding:10px 8px; border-radius:8px; cursor:pointer;}
  .steps li:hover,.steps li.active{background:var(--paper);}
  .steps li .stxt{font-size:13.5px; line-height:1.35; color:var(--graphite);}

  .stage{background:var(--white); border:1px solid var(--ivory); border-radius:14px; padding:38px 44px;}
  .stage h2{font-size:30px; margin:8px 0 16px;}
  .section-body{font-size:16px; color:var(--graphite); max-width:70ch;}
  .section-body p{margin:0 0 14px; color:var(--ink);}
  .section-body h4{font-size:19px; margin:26px 0 10px; color:var(--graphite);}
  .section-body ul{margin:0 0 18px; padding-left:20px;}
  .section-body li{margin:6px 0; color:var(--ink);}
  .more-line{font-size:14.5px; color:var(--ink); margin:6px 0 16px;
    padding:12px 16px; background:var(--paper); border:1px solid var(--ivory); border-radius:10px;}

  /* Awaiting asset */
  .pending{display:grid; grid-template-columns:auto 1fr; gap:7px 16px; align-items:baseline;
    background:var(--paper); border:1px solid var(--ivory); border-left:3px solid var(--orange);
    border-radius:10px; padding:15px 18px; margin:0 0 6px; font-size:13.5px;}
  .pending .pl{color:var(--ink); font-weight:700; white-space:nowrap;}
  .pending .pv{color:var(--graphite);}

  /* Version stamp */
  .vstamp{border-top:1px solid var(--ivory); background:var(--white);}
  .vstamp .vinner{max-width:1560px; margin:0 auto; padding:18px 30px; font-size:12px; color:var(--ink);}

  /* Embeds */
  .embed{margin:0 0 8px; border:1px solid var(--ivory); border-radius:12px; overflow:hidden; background:var(--white);}
  .embed.video .vwrap{padding:56.25% 0 0 0; position:relative;}
  .embed.video iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
  .embed.pdf{background:var(--white);}
  .pdfbar{display:flex; align-items:center; justify-content:center; gap:16px; padding:10px 12px;
    border-bottom:1px solid var(--ivory); background:var(--paper);}
  .pdfbar button{background:var(--white); border:1px solid var(--ink); color:var(--graphite);
    border-radius:7px; padding:7px 14px; font-size:13px; font-weight:700;}
  .pdfbar button:disabled{opacity:.4; cursor:not-allowed;}
  .pdfcount{font-size:13px; color:var(--ink); min-width:110px; text-align:center;}
  .pdfstage{display:flex; justify-content:center; padding:18px; background:var(--sand); min-height:300px;}
  #pdfcanvas{max-width:100%; height:auto; box-shadow:0 3px 14px rgba(30,30,30,.12); background:var(--white);}
  .pdferr{padding:40px; color:var(--ink); font-size:14px; text-align:center;}

  .stage-foot{display:flex; align-items:center; gap:14px; margin-top:22px; flex-wrap:wrap;}

  /* Finder */
  .finder{border:1px solid var(--ivory); border-radius:14px; background:var(--white); overflow:hidden; position:sticky; top:82px;}
  .finder-head{width:100%; display:flex; align-items:center; gap:14px; text-align:left; background:none; border:none; padding:16px 18px;}
  .finder-head:hover{background:var(--paper);}
  .fh-txt{display:flex; flex-direction:column; flex:1;}
  .fh-title{font-size:14.5px; font-weight:700;} .fh-sub{font-size:12.5px; color:var(--ink); margin-top:2px;}
  .finder .chev{font-size:13px; color:var(--ink);}
  .finder-body{display:none; padding:2px 18px 18px; border-top:1px solid var(--ivory);} .finder.open .finder-body{display:block;}
  .cgroup{padding:14px 0; border-bottom:1px solid var(--ivory);} .cgroup:last-child{border-bottom:none;}
  .clabel{display:block; font-size:12px; color:var(--ink); margin-bottom:10px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font-size:13px; color:var(--graphite); background:var(--white); border:1px solid var(--ivory); border-radius:999px; padding:7px 14px;}
  .chip:hover{border-color:var(--blue); color:var(--blue);}
  .chip.active{border-color:var(--blue); color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue);}

  /* Completion */
  .done-wrap{max-width:660px; margin:64px auto; text-align:center; background:var(--white); border:1px solid var(--ivory); border-radius:14px; padding:48px 44px;}
  .done-wrap .check{width:60px; height:60px; border-radius:50%; background:var(--ink); color:var(--white); display:grid; place-items:center; margin:0 auto 20px; font-size:28px;}
  .done-wrap h2{font-size:28px; margin:0 0 12px;} .done-wrap p{color:var(--ink); margin:0 auto 24px; max-width:48ch; font-size:15.5px;}
  .next-cards{display:grid; grid-template-columns:1fr 1fr; gap:14px; text-align:left; margin:26px 0 30px;}
  .next-cards .nc{border:1px solid var(--ivory); border-radius:10px; padding:16px 18px;}
  .next-cards .nc .h{font-weight:700; font-size:14.5px; margin:0 0 4px;} .next-cards .nc .d{font-size:13px; color:var(--ink); margin:0;}
  .switch{margin-top:16px; font-size:13px; background:none; border:none; color:var(--blue); padding:0;} .switch:hover{text-decoration:underline;}

  @media (max-width:1024px){
    .journey{grid-template-columns:1fr; gap:26px;}
    .rail,.finder{position:static;}
    .cards{grid-template-columns:1fr;}
    .next-cards{grid-template-columns:1fr;}
    .landing h1{font-size:30px;}
    .stage{padding:28px 24px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  :focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  /* ---- Draft 0.2 ---- */
  .brand img.mark{height:30px; width:auto; display:block; padding-right:14px; border-right:1px solid var(--ivory);}
  .top-switch{font-size:13px; color:var(--blue); font-weight:700; text-decoration:none; margin-left:12px;}
  body[data-screen="gate"] .top-switch, body[data-screen="landing"] .top-switch{display:none;}

  .journey{gap:32px;}
  .stage{padding:34px 30px;}
  .pdfstage{padding:10px;}
  .cards{grid-template-columns:repeat(auto-fit,minmax(272px,1fr));}

  .doc-tools{display:flex; gap:10px; align-items:center; margin:4px 0 12px; flex-wrap:wrap;}
  .doc-tools .dt{background:var(--white); border:1px solid var(--ink); color:var(--graphite);
    border-radius:8px; padding:8px 15px; font-size:13px; font-weight:700; text-decoration:none; display:inline-block;}
  .doc-tools .dt.primary{border-color:var(--blue); color:var(--blue);}

  .journey.expanded{grid-template-columns:minmax(0,1fr);}
  .journey.expanded .rail, .journey.expanded .finder{display:none;}

  .lock-note{margin:16px 0 0; padding:14px 17px; background:var(--paper); border:1px solid var(--ivory);
    border-left:3px solid var(--orange); border-radius:10px; font-size:13.5px; color:var(--ink);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}

  .resume{display:flex; gap:13px; align-items:center; flex-wrap:wrap; margin:0 0 22px; padding:15px 18px;
    background:var(--sand); border:1px solid var(--ivory); border-radius:12px; font-size:14px; color:var(--graphite);}
  .resume .rtxt{flex:1 1 260px;}
  .resume .ra{background:var(--blue); color:var(--white); border:none; border-radius:7px; padding:8px 16px; font-size:13px; font-weight:700;}
  .resume .rb{background:transparent; border:1px solid var(--ink); color:var(--graphite); border-radius:7px;
    padding:8px 16px; font-size:13px; font-weight:700;}



  .seealso{margin:22px 0 0; padding:18px 20px; background:var(--paper);
    border:1px solid var(--ivory); border-radius:12px;}
  .seealso .salabel{font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink); margin:0 0 12px;}
  .seealso ul{list-style:none; margin:0; padding:0;}
  .seealso li{margin:0 0 13px;}
  .seealso li:last-child{margin-bottom:0;}
  .seealso a{color:var(--blue); font-weight:700; font-size:14.5px; text-decoration:none; display:inline-block;}
  .seealso a:hover{text-decoration:underline;}
  .seealso a:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:3px;}
  .seealso .ext{font-weight:400;}
  .seealso .sad{display:block; font-size:13.5px; color:var(--ink); margin:3px 0 0; line-height:1.5;}

  .gate-grid{display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:start;}
  .gate-about{padding:8px 0 0;}
  .gate-about h2{font-size:27px; margin:0 0 16px; max-width:20ch;}
  .gate-about p{font-size:15px; color:var(--ink); margin:0 0 14px; max-width:52ch; line-height:1.6;}
  .gate-about .wl{font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--ink); margin:22px 0 10px; font-family:var(--sans);}
  .gate-about ul{margin:0; padding:0 0 0 20px; font-size:14.5px; color:var(--ink); line-height:1.7;}
  @media (max-width:900px){ .gate-grid{grid-template-columns:1fr; gap:26px;} }

  .callout{background:var(--sand); border-left:3px solid var(--orange); border-radius:8px;
    padding:15px 17px; margin:16px 0 0; font-size:13.5px; color:var(--graphite); line-height:1.55;}
  .callout .cl{display:block; font-weight:700; margin:0 0 5px;}

  .resgrid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:4px 0 22px;}
  @media (max-width:900px){ .resgrid{grid-template-columns:1fr;} }
  .rescard{background:var(--paper); border:1px solid var(--ivory); border-radius:12px; padding:20px 22px;}
  .rescard h4{font-size:16px; margin:0 0 10px;}
  .rescard p{font-size:14px; color:var(--ink); margin:0 0 12px; line-height:1.55;}
  .rescard .rsub{font-size:13px;}
  .rescard .dt{background:var(--white); border:1px solid var(--blue); color:var(--blue);
    border-radius:8px; padding:9px 15px; font-size:13.5px; font-weight:700; text-decoration:none; display:inline-block;}

  .reslist{background:var(--white); border:1px solid var(--ivory); border-radius:12px; padding:20px 22px;}
  .reslist .rlabel{font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink); margin:0 0 14px;}
  .reslist ul{list-style:none; margin:0; padding:0;}
  .reslist li{margin:0 0 15px;} .reslist li:last-child{margin-bottom:0;}
  .reslist a{color:var(--blue); font-weight:700; font-size:14.5px; text-decoration:none;}
  .reslist a:hover{text-decoration:underline;}
  .reslist a:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:3px;}
  .reslist .sad{display:block; font-size:13.5px; color:var(--ink); margin:3px 0 0; line-height:1.5;}

  .accgroup{margin:2px 0 0;}
  .acc{border:1px solid var(--ivory); border-radius:10px; margin:0 0 10px; overflow:hidden;}
  .acc-head{width:100%; display:flex; justify-content:space-between; align-items:center; gap:14px;
    background:var(--paper); border:none; padding:14px 17px; font-family:var(--sans); font-weight:700;
    font-size:14.5px; color:var(--graphite); text-align:left; cursor:pointer;}
  .acc-head .chev{font-size:17px; font-weight:700; color:var(--orange); flex:0 0 auto;}
  .acc-body{padding:4px 17px 16px; font-size:14px; color:var(--ink); line-height:1.55; background:var(--white);}
  .acc-body p{margin:0;}
  .rescard.wide{grid-column:1 / -1;}

  .certrow{margin:16px 0 0;}

  .gate-form.stack{flex-direction:column; align-items:stretch;}
  .gate-form.stack input{width:100%;}
  .gate-hint{font-size:13px; color:var(--ink); margin:16px 0 0; line-height:1.55;}
  .field-hint{font-size:12.5px; color:var(--ink); margin:-2px 0 2px; line-height:1.5;}
  .gate-warn{color:var(--graphite); background:var(--sand); border-left:3px solid var(--orange);
    border-radius:8px; padding:12px 15px; font-size:13px; margin:12px 0 0; display:none;}
  .gate-warn.show{display:block;}

  /* ---- Draft 0.9 ---- */
  .metarow{display:flex; align-items:center; justify-content:space-between; gap:14px;
    flex-wrap:wrap; margin:0 0 16px;}
  .tmeta{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink);
    background:var(--paper); border:1px solid var(--ivory); border-radius:999px; padding:5px 13px;}
  .tmeta .td{width:5px; height:5px; border-radius:50%; background:var(--orange); flex:none;}
  .sharehub{background:var(--white); border:1px solid var(--ink); color:var(--graphite);
    border-radius:8px; padding:7px 14px; font-size:13px; font-weight:700; white-space:nowrap;}
  .sharehub.copied{border-color:var(--blue); color:var(--blue);}
  body[data-screen="gate"] .sharehub{display:none;}
  .doc-tools .dt.share{border-color:var(--ink);}
  .doc-tools .dt.share.copied{border-color:var(--blue); color:var(--blue);}
  .steps li .smin{display:block; font-size:12px; color:var(--ink); margin-top:2px;}

  .why{margin:36px 0 0; padding:0;}
  .why h2{font-size:34px; line-height:1.1; margin:0 0 12px;} .why h2 em{font-style:italic;}
  .why .wlede{font-size:16px; color:var(--ink); margin:0 0 20px; max-width:64ch; line-height:1.6;}
  .whygrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:18px;}
  .whycard{background:var(--white); border:1px solid var(--ivory); border-radius:12px; padding:22px 24px;}
  .whycard h4{font-size:15.5px; margin:0 0 8px;}
  .whycard p{font-size:14px; color:var(--ink); margin:0; line-height:1.55;}

  .oblig{background:var(--sand); border-left:3px solid var(--orange); border-radius:8px;
    padding:17px 19px; margin:0 0 22px; font-size:14.5px; color:var(--graphite); line-height:1.6;}
  .oblig .ol{display:block; font-family:var(--sans); font-weight:700; margin:0 0 6px;}

  .exq{border:1px solid var(--ivory); border-radius:12px; margin:4px 0 20px; overflow:hidden; background:var(--white);}
  .exq-head{width:100%; display:flex; justify-content:space-between; align-items:center; gap:14px;
    background:var(--paper); border:none; padding:14px 17px; font-family:var(--sans); font-weight:700;

  /* =====================================================================
     LEARNER IDENTITY

     The address a learner types never leaves the browser. It is run through
     SHA-256 here and only the hash is sent, as the name of an xAPI account
     object rather than an mbox.

     Hashing is one way and deterministic, so the same address always gives
     the same hash. A returning learner still finds their progress and the
     LRS holds no address. Given a candidate address you can hash it and
     match a record, which covers deletion and access requests. You cannot
     work back from stored hashes to a list of people.

     This is pseudonymisation, not anonymisation. Email addresses are low
     entropy, so a hash still singles out an individual and remains personal
     data under GDPR. The salt below sits in client-side code and is public.
     It stops a hash from this hub matching the same address hashed
     elsewhere. It is not a secret.

     ID_HOMEPAGE forms part of the identifier. Changing it orphans every
     existing progress record, so do not change it once real data exists.
     ===================================================================== */
  var ID_SALT = "cs-ondemand:ckai:v1:";
  var ID_HOMEPAGE = "https://elsevierresources.com/clinicalkey-ai-pilot/cs-ondemand/";

  function hashId(email){
    var norm = String(email||"").trim().toLowerCase();
    var c = window.crypto;
    if(!c || !c.subtle || !c.subtle.digest || !window.TextEncoder){
      /* Fail closed. Never fall back to sending the address in the clear. */
      return Promise.reject(new Error("subtle-crypto-unavailable"));
    }
    return c.subtle.digest("SHA-256", new TextEncoder().encode(ID_SALT + norm))
      .then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){
          return ("00" + b.toString(16)).slice(-2);
        }).join("");
      });
  }

  var pdfLib=null, pdfDoc=null, pdfPage=1, pdfTotal=0, pdfReqUrl=null, pdfTask=null;

  function ensurePdfLib(){
    if(pdfLib) return Promise.resolve(pdfLib);
    return new Promise(function(res,rej){

  function setupPdf(url){
    pdfReqUrl=url; pdfDoc=null; pdfPage=1; pdfTotal=0;
    var cnt=document.getElementById("pdfcount"); if(cnt) cnt.textContent="Loading";
    ensurePdfLib().then(function(lib){ return lib.getDocument(url).promise; }).then(function(doc){

  function renderPdfPage(){

    if(pdfTask){ try{ pdfTask.cancel(); }catch(e){} pdfTask=null; }
    pdfDoc.getPage(pdfPage).then(function(page){

      var cssScale=avail/base.width;
      var rs=cssScale*SS;
      if(base.width*rs>MAXW) rs=MAXW/base.width;
      var vp=page.getViewport({scale:rs});
      var ctx=canvas.getContext("2d");

    });
  }

      steps.map(function(x,i){ var cls=(i===state.idx?"active ":"")+(state.done[key(x)]?"done":"");
        if(x.type==="wrapup"){
          var ready=allViewed(steps);
          var left=unviewed(steps), shown=left.slice(0,4), hidden=left.length-shown.length;
          return '<li class="term '+(ready?"ready ":"islocked ")+cls+'" '+
            (ready?'data-action="goto-step" data-idx="'+i+'"':'data-action="wrap-locked"')+
            ' tabindex="0" role="button"'+(ready?'':' aria-disabled="true"')+'>'+
            '<span class="mk">'+SQUARE+'</span><span class="stxt">'+x.title+
            '<span class="smin">'+(ready?"Ready":"Not open yet")+'</span></span></li>'+
            (ready?'':'<div class="railtip" id="railtip"><span class="rt">'+
              (left.length===1?"One step left to view":left.length+" steps left to view")+'</span><ul>'+
              shown.map(function(u){ return '<li>'+u.t+'</li>'; }).join("")+'</ul>'+
              (hidden>0?'<p class="anyorder">and '+hidden+' more</p>':'')+
              '<p class="anyorder">Any order is fine. Nothing here is graded.</p></div>');
        }
        return '<li class="'+cls+'" data-action="goto-step" data-idx="'+i+'" tabindex="0" role="button">'+
          '<span class="mk">'+RING+'</span><span class="stxt">'+x.title+
          (state.done[key(x)]
            ? '<span class="smin"><span class="vchk">'+CHK+'Viewed</span></span>'
            : (x.mins?'<span class="smin">about '+x.mins+' min</span>':''))+
          '</span></li>'; }).join("")+
      '</ul><button class="switch" data-action="restart">Switch path</button></aside>';

    var isFirst=state.idx===0, isWrap=(s.type==="wrapup");
    var lastContent=(state.idx===cTotal-1);

    var tools = (s.embed && s.embed.kind==="pdf" && s.type!=="sources" && s.type!=="resources-clinician") ?
      '<div class="doc-tools">'+
      '<button class="dt primary" data-action="toggle-expand">'+(state.expanded?"Exit full size":"View full size")+'</button>'+
      (s.guide?'<a class="dt" data-action="open-guide" data-guide="'+s.guide+'" href="'+s.guide+'" target="_blank" rel="noopener">Download this guide</a>':'')+
      (s.guide?'<button class="dt share" data-action="share-guide" data-guide="'+s.guide+'">Share this guide with a colleague</button>':'')+
      '</div>' : '';

    /* Advance wording follows what the record can actually attest to. Viewing is
       observable; understanding is not. */
    var footBtn = "";
    if(!isWrap){
      var nextIsWrap = lastContent;
      var verb = state.done[key(s)] ? "" : "Viewed, ";
      var dest = nextIsWrap ? "wrap up" : "next step";
      var lbl = verb ? verb+dest : dest.charAt(0).toUpperCase()+dest.slice(1);
      footBtn = '<button class="btn-primary" data-action="next">'+lbl+'</button>';
    }

    var eyebrow = isWrap
      ? '<p class="eyebrow">End of the '+j.label.toLowerCase()+'</p>'
      : '<p class="eyebrow">Step '+(state.idx+1)+' of '+cTotal+'</p>';

    var stage='<section class="stage">'+resumeBanner()+eyebrow+'<h2>'+s.title+'</h2>'+
      (isWrap ? wrapUpScreen(j) :
        metaRow(s)+ obligBlock()+
        '<div class="section-body">'+(s.body||"")+'</div>'+ exqBlock(s) + tools +
        (s.type==="resources"?resourcesScreen():s.type==="sources"?contentSourcesBody():s.type==="resources-clinician"?clinicianContactScreen():media(s))+ seeAlso(s))+
      '<div class="stage-foot"><button class="btn-ghost" data-action="prev"'+(isFirst?" disabled":"")+'>Previous</button>'+
      footBtn+
      (isWrap?'<button class="btn-ghost" data-action="restart">Back to start</button>':'')+
      '</div></section>';

    return '<div class="jwrap"><div class="journey'+(state.expanded?" expanded":"")+'">'+rail+stage+finder(steps)+'</div></div>';
  }

  function wrapUpScreen(j){
    return '<p class="wrapintro">That is the '+j.label.toLowerCase()+
      ' covered. Nothing here was graded, and every step stays open if you want to go back to one. '+
      'Before you go, here is what has changed recently.</p>'+
      '<p class="asof">'+NEWS_ASOF+'</p>'+
      NEWS.map(function(g){
        return '<section class="newsgrp"><h4>'+g.t+'</h4>'+
          g.i.map(function(n){
            return '<div class="newsitem"><p class="nh">'+n.h+'</p><p class="nd">'+n.d+'</p></div>';
          }).join("")+'</section>';
      }).join("");
  }

  function clinicianContactScreen(){
    return '<div class="resgrid">'+
      '<div class="rescard"><h4>ClinicalKey AI Support Center</h4>'+
      '<p>Guidance, tutorials and troubleshooting for using ClinicalKey AI day to day.</p>'+
      '<a class="dt primary" href="'+SUPPORT_URL+'" data-action="open-resource" data-res="'+SUPPORT_URL+'" data-restitle="Support Center" target="_blank" rel="noopener">Open the Support Center \u2197</a></div>'+
      '<div class="rescard"><h4>Talk to someone</h4>'+
      '<p>Request time with the team that supports your account.</p>'+
      '<a class="dt primary" href="'+CALL_URL+'" data-action="open-resource" data-res="'+CALL_URL+'" data-restitle="Schedule a call" target="_blank" rel="noopener">Schedule a call \u2197</a></div>'+
      '</div>';
  }

  function resourcesScreen(){
    var cards =
      '<div class="rescard"><h4>ClinicalKey AI Support Center</h4>'+
      '<p>A resource hub that helps healthcare professionals use AI tools within ClinicalKey, offering guidance, tutorials and troubleshooting to improve clinical decision-making and patient care.</p>'+
      '<p class="rsub">Browse by Orders and renewals, Access, Onboarding, Training, Using the product, or Content. The top answers cover single sign-on contacts, supported devices, claiming CME and MOC, and how ClinicalKey AI manages hallucinations.</p>'+
      '<a class="dt primary" href="'+SUPPORT_URL+'" data-action="open-resource" data-res="'+SUPPORT_URL+'" data-restitle="Support Center" target="_blank" rel="noopener">Open the Support Center \u2197</a></div>'+

      '<div class="rescard"><h4>Talk to someone</h4>'+
      '<p>If you would rather work through something with a person, you can request time with the team that supports your account.</p>'+
      '<a class="dt primary" href="'+CALL_URL+'" data-action="open-resource" data-res="'+CALL_URL+'" data-restitle="Schedule a call" target="_blank" rel="noopener">Schedule a call \u2197</a></div>'+

      '<div class="rescard wide"><h4>Driving adoption at your organization</h4>'+
      '<p>Time-pressed clinicians do not always discover what ClinicalKey AI can do on their own. This kit gives you ready messaging, a short feature overview, and promotional assets, including flyers, email templates, and banner ads, so you can raise awareness across your organization and steer people away from unsanctioned generic AI tools.</p>'+
      (ADOPTION_KIT_URL
        ? '<a class="dt primary" href="'+ADOPTION_KIT_URL+'" data-action="open-resource" data-res="'+ADOPTION_KIT_URL+'" data-restitle="Adoption kit" target="_blank" rel="noopener">Open the adoption kit \u2197</a>'
        : '<div class="pending"><span class="pl">Awaiting</span><span class="pv">Adoption kit link</span><span class="pl">Sourcing</span><span class="pv">John Grooms</span></div>')+
      '</div>';

    function linkList(label, arr){
      return '<div class="reslist"><p class="rlabel">'+label+'</p><ul>'+
        arr.map(function(r){
          return '<li><a href="'+r.u+'" data-action="open-resource" data-res="'+r.u+'" data-restitle="'+r.t+'" target="_blank" rel="noopener">'+r.t+' <span class="ext" aria-label="opens in a new tab">\u2197</span></a>'+
            '<span class="sad">'+r.d+'</span></li>';
        }).join("")+'</ul></div>';
    }

    return '<div class="resgrid">'+cards+'</div>'+
      linkList("Where the content comes from", SOURCES)+
      '<div style="height:18px"></div>'+
      linkList("Further reading", RES);
  }

  function seeAlso(st){
    if(!st.also || !st.also.length) return "";
    return '<aside class="seealso"><p class="salabel">See also</p><ul>'+
      st.also.map(function(r){
        var ext = r.u.indexOf("http")===0;
        return '<li><a href="'+r.u+'" data-action="open-resource" data-res="'+r.u+'" data-restitle="'+r.t+'" target="_blank" rel="noopener">'+r.t+
          (ext?' <span class="ext" aria-label="opens an external site">\u2197</span>':'')+'</a>'+
          '<span class="sad">'+r.d+'</span></li>';
      }).join("")+'</ul></aside>';
  }

  function resumeBanner(){
    if(!state.resumeOffer) return "";
    var n=Object.keys(state.resumeOffer.done||{}).length;
    return '<div class="resume"><span class="rtxt">You have saved progress on this path, with '+n+' step'+(n===1?"":"s")+' marked done. Pick up where you left off?</span>'+
      '<button class="ra" data-action="resume-yes">Resume</button>'+
      '<button class="rb" data-action="resume-no">Start over</button></div>';
  }


  function media(s){
    if(s.embed && s.embed.kind==="vimeo"){
      return '<div class="embed video"><div class="vwrap"><iframe src="'+s.embed.src+'" title="'+s.title+'" frameborder="0" '+
        'allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" allowfullscreen '+
        'referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>';
    }
    if(s.embed && s.embed.kind==="pdf"){
      return '<div class="embed pdf"><div class="pdfbar">'+
        '<button id="pdfprev" data-action="pdf-prev">Previous</button>'+
        '<span class="pdfcount" id="pdfcount">Loading</span>'+
        '<button id="pdfnext" data-action="pdf-next">Next</button></div>'+
        '<div class="pdfstage" id="pdfstage"><canvas id="pdfcanvas"></canvas></div></div>';
    }
    return '<div class="embed" style="border-style:dashed;background:var(--sand)"><div style="padding:40px 34px;min-height:180px;display:flex;flex-direction:column;gap:8px;justify-content:center">'+
      '<span style="font-size:12.5px;color:var(--ink)">Embedded resource</span>'+
      '<span class="serif" style="font-size:22px">'+s.title+'</span>'+
      '<span style="font-size:13.5px;color:var(--ink)">Live asset renders here once its link is added.</span></div></div>';
  }
  function finder(steps){
    var order=["Get oriented","Ask better questions","Deploy and configure","Know the product","Use it day to day","Continuing education","Keep going"], groups={};
    steps.forEach(function(s,i){ (groups[s.cat]=groups[s.cat]||[]).push({s:s,i:i}); });
    var body=order.filter(function(c){return groups[c];}).map(function(c){
      var chips=groups[c].map(function(o){ return '<button class="chip'+(o.i===state.idx?" active":"")+'" data-action="goto-step" data-idx="'+o.i+'">'+o.s.concern+'</button>'; }).join("");
      return '<div class="cgroup"><span class="clabel">'+c+'</span><div class="chips">'+chips+'</div></div>';
    }).join("");
    return '<div class="finder'+(state.indexOpen?" open":"")+'"><button class="finder-head" data-action="toggle-index" aria-expanded="'+(state.indexOpen?"true":"false")+'">'+
      '<span class="fh-txt"><span class="fh-title">Looking for something specific?</span><span class="fh-sub">Jump straight to a topic and land on the right step</span></span>'+
      '<span class="chev">'+(state.indexOpen?"\u25be":"\u25b8")+'</span></button><div class="finder-body">'+body+'</div></div>';
  }
  function done(){
    var j=journeys[state.role];
    return '<div class="wrap"><div class="done-wrap"><div class="check">\u2713</div>'+
      '<h2>You have completed the '+j.label.toLowerCase()+'</h2>'+
      '<p>That is the core of getting going with ClinicalKey AI. Here is where to go from here.</p>'+
      '<div class="next-cards"><div class="nc"><p class="h">Keep exploring</p><p class="d">Revisit any step from the path whenever you need a refresher.</p></div>'+
      '<div class="nc"><p class="h">Hit a snag?</p><p class="d">The Support Center handles account, access, and troubleshooting questions.</p></div></div>'+
      '<button class="switch" data-action="restart">Back to start</button></div></div>';
  }

  /* ---- Draft 0.9 helpers ---- */

  var RING = '<svg class="dotsvg" width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">'+
             '<circle class="ring" cx="8" cy="8" r="6"/></svg>';
  var SQUARE = '<svg class="dotsvg" width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">'+
             '<rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/></svg>';
  var CHK = '<svg width="11" height="11" viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">'+
            '<path d="M1.5 6.5 L4.5 9.5 L10.5 2.5" fill="none" stroke="#544946" stroke-width="2" '+
            'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* Why ClinicalKey AI. Sits below the path cards, because the action on the landing
     page is choosing a path; the value case supports that choice rather than blocking it. */

  /* Professional obligation. Step one of the clinical paths only. */
  function obligBlock(){
    if(state.idx!==0) return "";
    var o = OBLIGATION[state.role];
    if(!o) return "";
    return '<div class="oblig"><span class="ol">Why this matters</span>'+o+'</div>';
  }

  /* Example queries. Shown above the embedded guide on the steps that teach asking. */
  function exqBlock(st){
    if(!st.exq) return "";
    var e = EXQ[state.role];
    if(!e) return "";
    var body = "";
    if(state.exqOpen){
      body = '<div class="exq-body">'+e.items.map(function(it){
        return '<div class="exq-item"><p class="exq-lab">'+it.lab+'</p>'+
          '<p class="exq-case">'+it.c+'</p><p class="exq-q">'+it.q+'</p></div>';
      }).join("")+
      '<p class="exq-foot">'+e.foot+' '+
      '<a href="'+CKAI_HOME+'" data-action="open-resource" data-res="'+CKAI_HOME+'" '+
      'data-restitle="ClinicalKey AI home" target="_blank" rel="noopener">Open ClinicalKey AI \u2197</a></p></div>';
    }
    return '<div class="exq"><button class="exq-head" data-action="toggle-exq" '+
      'aria-expanded="'+(state.exqOpen?"true":"false")+'"><span>'+e.label+'</span>'+
      '<span class="chev">'+(state.exqOpen?"\u2212":"+")+'</span></button>'+body+'</div>';
  }

  /* Time estimate covers the walkthrough on this page plus the guide it embeds. */
  function pathMins(steps){
    return steps.reduce(function(a,x){ return a + (x.mins||0); }, 0);
  }
  function metaRow(st){
    if(!st.mins) return "";
    return '<div class="metarow"><span class="tmeta"><span class="td"></span>About '+
      st.mins+' minutes, including the guide</span></div>';
  }

  /* Share links are composed from SHARE_BASE, since script inside the iframe cannot read
     the parent URL. Inbound routing reads the fragment on this document, which works when
     the hub is opened directly. For it to work through the WordPress embed the parent page
     has to forward its fragment to the iframe src. Karen Cima-Thornhill owns that change. */
  function copyText(t){
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return true; } }catch(e){}
    try{
      var ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly","");
      ta.style.position="absolute"; ta.style.left="-9999px";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy");
      document.body.removeChild(ta); return true;
    }catch(e2){ return false; }
  }
  function readDeep(){
    var h=(window.location.hash||"").replace(/^#/,"");
    if(!h || h.indexOf("/")<0) return null;
    var p=h.split("/"), r=p[0], sl=p[1];
    if(!journeys[r]) return null;
    var found=-1;
    journeys[r].steps.forEach(function(x,i){ if(key(x)===sl) found=i; });
    return found<0 ? null : {role:r, idx:found};
  }

  /* Everything that used to run inline at the gate, reached once the address
     has been converted. */
  function afterGate(){
    xapi(VERBS.initialized, activity("hub","Onboarding and Enablement Hub"));
    if(state.deep && journeys[state.deep.role]){
      var dr=state.deep.role, di=state.deep.idx; state.deep=null;
      state.role=dr; state.idx=di; state.screen="journey";
      xapi(VERBS.selected, activity("path/"+dr, journeys[dr].label));
      var ds2=journeys[dr].steps[di];
      xapi(VERBS.experienced, activity("path/"+dr+"/step/"+key(ds2), ds2.title));
      render();
      /* Merge saved progress but hold the requested step, since a shared link
         is a request for one page rather than an offer to resume. */
      loadProgress(dr, function(d){
        if(!d || state.role!==dr || state.screen!=="journey") return;
        state.done=d.done||{};
        render();
      });
      return;
    }
    state.screen="landing"; render();
  }

  function render(){
    document.body.setAttribute("data-screen", state.screen);
    if(state.role) roleChip.textContent = journeys[state.role].label;
    if(state.screen==="gate") app.innerHTML=gate();
    else if(state.screen==="landing") app.innerHTML=landing();
    else if(state.screen==="journey") app.innerHTML=journey();
    else app.innerHTML=done();
    updateBadge();
    if(state.screen==="journey"){
      var cs=journeys[state.role].steps[state.idx];
      if(cs.embed && cs.embed.kind==="pdf") setupPdf(cs.embed.src);
    }
    window.scrollTo({top:0,behavior:"auto"});
  }

  function handle(action, el){
    if(action==="submit-email"){
      var i=document.getElementById("gate-email"), v=i?i.value.trim():"", at=v.indexOf("@"), dot=v.lastIndexOf(".");
      var o=document.getElementById("gate-org"), ov=o?o.value.trim():"";
      var errEl=document.getElementById("gate-err"), warnEl=document.getElementById("gate-orgwarn");
      if(!(at>0 && dot>at+1 && dot<v.length-1) || ov.length<2){ if(errEl) errEl.classList.add("show"); return; }
      if(errEl) errEl.classList.remove("show");
      var looksAbbrev = ov.length<=6 && ov.indexOf(" ")===-1 && ov===ov.toUpperCase() && /[A-Z]/.test(ov);
      if(looksAbbrev && state.orgWarned!==ov){ state.orgWarned=ov; if(warnEl) warnEl.classList.add("show"); return; }
      var cryptoEl=document.getElementById("gate-cryptoerr");
      if(cryptoEl) cryptoEl.classList.remove("show");
      state.org=ov;
      /* Convert the address before anything is sent. If the browser cannot do
         it, stop rather than fall back to sending it in the clear. */
      hashId(v).then(function(uid){ state.uid=uid; v=null; afterGate(); })
               .catch(function(){ if(cryptoEl) cryptoEl.classList.add("show"); });
      return;
    }
    if(action==="choose-role"){
      state.role=el.getAttribute("data-role"); state.idx=0; state.done={};
      state.expanded=false; state.resumeOffer=null; state.screen="journey";
      xapi(VERBS.selected, activity("path/"+state.role, journeys[state.role].label));
      render();
      var want=state.role;
      loadProgress(want, function(d){
        if(!d || state.role!==want || state.screen!=="journey") return;
        if(d.done && Object.keys(d.done).length){ state.resumeOffer=d; render(); }
      });
      return;
    }
    if(action==="resume-yes"){
      var rd=state.resumeOffer||{}, rsteps=journeys[state.role].steps;
      state.done=rd.done||{};
      var want=Math.min(typeof rd.idx==="number"?rd.idx:0, rsteps.length-1);
      /* Never resume onto a wrap up that is not open yet. */
      if(rsteps[want] && rsteps[want].type==="wrapup" && !allViewed(rsteps)){
        want=(unviewed(rsteps)[0]||{i:0}).i;
      }
      state.idx=want;
      state.resumeOffer=null; render(); return;
    }
    if(action==="resume-no"){ state.resumeOffer=null; saveProgress(); render(); return; }
    if(action==="goto-step"){ state.idx=parseInt(el.getAttribute("data-idx"),10); state.expanded=false;
      var gs=journeys[state.role].steps[state.idx]; xapi(VERBS.experienced, activity("path/"+state.role+"/step/"+key(gs), gs.title)); render(); return; }
    if(action==="toggle-expand"){ state.expanded=!state.expanded; state.pdfPageWanted=pdfPage; render(); return; }
    if(action==="toggle-acc"){ var ai=parseInt(el.getAttribute("data-idx"),10); state.accOpen[ai]=!state.accOpen[ai]; render(); return; }
    if(action==="next"){
      var steps=journeys[state.role].steps, d=steps[state.idx];
      if(!state.done[key(d)]){
        state.done[key(d)]=true;
        xapi(VERBS.completed, activity("path/"+state.role+"/step/"+key(d), d.title));
      }
      var cT=contentSteps(steps).length;
      if(state.idx < cT-1){ state.idx++; }
      else if(allViewed(steps)){
        /* Wrap up is the last entry in the array. */
        state.idx = steps.length-1;
        xapi(VERBS.completed, activity("path/"+state.role, journeys[state.role].label));
      } else {
        /* Steps were taken out of order, so send them to the first one still unseen
           rather than to a wrap up that is not open. */
        state.idx = unviewed(steps)[0].i;
      }
      state.expanded=false; saveProgress(); render(); return;
    }
    if(action==="wrap-locked"){
      var rt=document.getElementById("railtip");
      if(rt) rt.classList.toggle("show");
      return;
    }
    if(action==="prev"){ if(state.idx>0){ state.idx--; state.expanded=false; render(); } return; }
    if(action==="restart"){ state.screen="landing"; state.role=null; state.idx=0; state.done={};
      state.expanded=false; state.resumeOffer=null; render(); return; }
    if(action==="toggle-index"){ state.indexOpen=!state.indexOpen; render(); return; }
    if(action==="pdf-prev"){ if(pdfDoc && pdfPage>1){ pdfPage--; renderPdfPage(); } return; }
    if(action==="pdf-next"){ if(pdfDoc && pdfPage<pdfTotal){ pdfPage++; renderPdfPage(); } return; }
    if(action==="open-resource"){
      var ru=el.getAttribute("data-res"), rt=el.getAttribute("data-restitle")||"";
      xapi(VERBS.experienced, activity("resource/"+slug(rt), "See also: "+rt));
      window.open(ru,"_blank","noopener"); return;
    }
    if(action==="open-guide"){
      var url=el.getAttribute("data-guide"), ds=journeys[state.role]?journeys[state.role].steps[state.idx]:null;
      xapi(VERBS.downloaded, activity("guide/"+(ds?slug(ds.title):"item"), "Guide: "+(ds?ds.title:"")));
      window.open(url,"_blank","noopener"); return;
    }
  }

  if(!TESTING){
    var tb=document.getElementById("testbar"); if(tb) tb.style.display="none";
    var lb=document.getElementById("lrs-badge"); if(lb) lb.style.display="none";
    document.body.setAttribute("data-testing","off");
  }

  document.addEventListener("click", function(e){ var el=e.target.closest("[data-action]"); if(!el) return;
    if(!(el.tagName==="INPUT" && el.type==="radio")) e.preventDefault();
    handle(el.getAttribute("data-action"), el); });
  document.addEventListener("keydown", function(e){ if((e.key==="Enter"||e.key===" ") && e.target.matches('.steps li[data-action]')){ e.preventDefault(); handle("goto-step", e.target); } });
  var rz; window.addEventListener("resize", function(){ clearTimeout(rz); rz=setTimeout(function(){ if(pdfDoc && state.screen==="journey"){ var cs=journeys[state.role].steps[state.idx]; if(cs.embed&&cs.embed.kind==="pdf") renderPdfPage(); } },150); });

  state.deep = readDeep();
  render();
})();
</script>
</body>
</html>
