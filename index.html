<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Onboarding and Enablement Hub</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="alternate icon" href="assets/favicon.png" />
<style>
  @font-face{font-family:"Tiempos Text";src:url("fonts/tiempos-text-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:"Tiempos Text";src:url("fonts/tiempos-text-regular-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap;}
  @font-face{font-family:"National 2";src:url("fonts/national-2-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:"National 2";src:url("fonts/national-2-regular-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap;}
  @font-face{font-family:"National 2";src:url("fonts/national-2-bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:"National 2";src:url("fonts/national-2-bold-italic.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap;}

  :root{
    --graphite:#1E1E1E; --white:#FFFFFF; --paper:#F7F4EF; --sand:#EEE7D7;
    --ink:#544946; --orange:#FF551D; --blue:#2354FF; --ivory:#E1DFDB;
    --serif:"Tiempos Text",Georgia,serif; --sans:"National 2",Arial,sans-serif;
    /* Status tokens drawn from the brand palette only. */
    --ok:#1E1E1E; --warn:#544946; --err:#FF551D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans); color:var(--graphite); background:var(--paper);
    line-height:1.55; letter-spacing:-0.02em; -webkit-font-smoothing:antialiased;}
  h1,h2,.serif{font-family:var(--serif); letter-spacing:-0.02em; font-weight:400;}
  h3,h4,h5{font-family:var(--sans); font-weight:700; letter-spacing:-0.02em;}
  a{color:var(--blue); text-decoration:none;} a:hover{text-decoration:underline;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:1160px; margin:0 auto; padding:0 26px;}
  .jwrap{max-width:1560px; margin:0 auto; padding:0 30px;}
  .eyebrow{font-size:12.5px; color:var(--ink); margin:0 0 10px;}

  .btn-primary{background:var(--blue); color:var(--white); border:none; border-radius:8px;
    padding:12px 22px; font-size:14.5px; font-weight:700;}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-ghost{background:var(--white); color:var(--graphite); border:1px solid var(--ink);
    border-radius:8px; padding:11px 18px; font-size:14px; font-weight:700;}
  .btn-ghost:disabled{opacity:.4; cursor:not-allowed;}

  /* Testing notice */
  .testbar{background:var(--graphite); color:var(--white); text-align:center; font-size:12.5px; padding:8px 16px;}
  .gate-test{background:var(--sand); border-left:3px solid var(--orange); border-radius:8px;
    padding:12px 14px; font-size:13px; color:var(--graphite); margin:0 0 18px; line-height:1.5;}

  /* Top bar */
  .topbar{position:sticky; top:0; z-index:40; background:var(--white); border-bottom:1px solid var(--ivory);}
  .topbar .inner{max-width:1560px; margin:0 auto; padding:14px 30px; display:flex; align-items:center; gap:16px;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .mark{font-size:14px; font-weight:700; padding-right:14px; border-right:1px solid var(--ivory);}
  .brand .prod .n{font-size:16px; font-weight:700; line-height:1.15;}
  .brand .prod .s{font-size:12px; color:var(--ink);}
  .topbar .spacer{flex:1;}
  .role-chip{display:none; font-size:12.5px; color:var(--ink); background:var(--sand); border-radius:999px; padding:5px 12px;}
  body[data-screen="journey"] .role-chip, body[data-screen="done"] .role-chip{display:inline-flex;}
  .tlink{font-size:13.5px;}
  .lrs-badge{display:none; align-items:center; gap:10px; font-size:12px; padding:5px 12px;
    border:1px solid var(--ivory); border-radius:999px; background:var(--white);}
  .lrs-badge .lrs-dot{width:9px; height:9px; border-radius:50%; background:var(--ivory); flex:none;}
  .lrs-badge.live .lrs-dot{background:var(--ok);} .lrs-badge.sending .lrs-dot{background:var(--warn);}
  .lrs-badge.error .lrs-dot{background:var(--err);}
  .lrs-badge .lrs-status{font-weight:700;}
  .lrs-badge .lrs-email{color:var(--ink); border-left:1px solid var(--ivory); padding-left:10px;
    max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lrs-badge .lrs-count{color:var(--ink);}

  /* Gate */
  .gate-wrap{min-height:64vh; display:grid; place-items:center; padding:48px 0;}
  .gate{max-width:480px; width:100%; background:var(--white); border:1px solid var(--ivory); border-radius:14px; padding:38px 34px;}
  .gate h1{font-size:32px; margin:6px 0 0;}
  .gate .rule{width:52px; height:3px; background:var(--orange); margin:14px 0 16px; border-radius:2px;}
  .gate p{font-size:14.5px; color:var(--ink); margin:0 0 20px;}
  .gate-form{display:flex; gap:10px; flex-wrap:wrap;}
  .gate-form input{flex:1; min-width:220px; padding:12px 14px; border:1px solid var(--ink); border-radius:8px;
    font-family:inherit; font-size:14.5px; background:var(--white); color:var(--graphite);}
  .gate-err{color:var(--err); font-size:13px; margin:12px 0 0; display:none;} .gate-err.show{display:block;}
  .gate-note{font-size:12px; color:var(--ink); margin:18px 0 0; line-height:1.5;}

  /* Landing */
  .landing{padding:52px 0 72px;}
  .landing .hero{max-width:720px;}
  .landing h1{font-size:40px; line-height:1.1; margin:8px 0 0;} .landing h1 em{font-style:italic;}
  .landing .rule{width:60px; height:3px; background:var(--orange); margin:16px 0 18px; border-radius:2px;}
  .landing .lede{font-size:17px; color:var(--ink); margin:0; max-width:60ch;}
  .cards{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:38px 0 0;}
  .card{background:var(--white); border:1px solid var(--ivory); border-radius:14px; padding:26px;
    display:flex; flex-direction:column; gap:12px; transition:box-shadow .15s, transform .15s;}
  .card:hover{box-shadow:0 8px 26px rgba(30,30,30,.08); transform:translateY(-2px);}
  .card h3{margin:0; font-size:20px;} .card .who{font-size:14px; color:var(--ink); margin:0;}
  .card ul{margin:2px 0 0; padding-left:18px; font-size:14px; color:var(--ink);} .card ul li{margin:4px 0;}
  .card .go{margin-top:auto; align-self:flex-start;}

  /* Journey: wide, center-dominant, side panels pushed out */
  .journey{display:grid; grid-template-columns:220px minmax(0,1fr) 250px; gap:46px;
    padding:34px 0 72px; align-items:start;}
  .rail{background:var(--white); border:1px solid var(--ivory); border-radius:14px; padding:22px; position:sticky; top:82px;}
  .rail .rtitle{font-size:15px; font-weight:700; margin:0 0 2px;} .rail .rmeta{font-size:12.5px; color:var(--ink); margin:0 0 14px;}
  .bar{height:6px; background:var(--sand); border-radius:999px; overflow:hidden; margin-bottom:18px;}
  .bar > span{display:block; height:100%; background:var(--orange); transition:width .25s;}
  .steps{list-style:none; margin:0; padding:0;}
  .steps li{display:flex; gap:12px; align-items:flex-start; padding:10px 8px; border-radius:8px; cursor:pointer;}
  .steps li:hover,.steps li.active{background:var(--paper);}
  .steps li .num{flex:none; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--ivory);
    display:grid; place-items:center; font-size:12px; color:var(--ink); background:var(--white); margin-top:1px; font-weight:700;}
  .steps li.active .num{border-color:var(--orange); color:var(--graphite);}
  .steps li.done .num{background:var(--ink); border-color:var(--ink); color:var(--white);}
  .steps li .stxt{font-size:13.5px; line-height:1.35; color:var(--graphite);}

  .stage{background:var(--white); border:1px solid var(--ivory); border-radius:14px; padding:38px 44px;}
  .stage h2{font-size:30px; margin:8px 0 16px;}
  .section-body{font-size:16px; color:var(--graphite); max-width:70ch;}
  .section-body p{margin:0 0 14px; color:var(--ink);}
  .section-body h4{font-size:14.5px; margin:20px 0 8px; color:var(--graphite);}
  .section-body ul{margin:0 0 18px; padding-left:20px;}
  .section-body li{margin:6px 0; color:var(--ink);}
  .more-line{font-size:14.5px; color:var(--ink); margin:6px 0 16px;
    padding:12px 16px; background:var(--paper); border:1px solid var(--ivory); border-radius:10px;}

  /* Awaiting asset */
  .pending{display:grid; grid-template-columns:auto 1fr; gap:7px 16px; align-items:baseline;
    background:var(--paper); border:1px solid var(--ivory); border-left:3px solid var(--orange);
    border-radius:10px; padding:15px 18px; margin:0 0 6px; font-size:13.5px;}
  .pending .pl{color:var(--ink); font-weight:700; white-space:nowrap;}
  .pending .pv{color:var(--graphite);}

  /* Version stamp */
  .vstamp{border-top:1px solid var(--ivory); background:var(--white);}
  .vstamp .vinner{max-width:1560px; margin:0 auto; padding:18px 30px; font-size:12px; color:var(--ink);}

  /* Embeds */
  .embed{margin:0 0 8px; border:1px solid var(--ivory); border-radius:12px; overflow:hidden; background:var(--white);}
  .embed.video .vwrap{padding:56.25% 0 0 0; position:relative;}
  .embed.video iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
  .embed.pdf{background:var(--white);}
  .pdfbar{display:flex; align-items:center; justify-content:center; gap:16px; padding:10px 12px;
    border-bottom:1px solid var(--ivory); background:var(--paper);}
  .pdfbar button{background:var(--white); border:1px solid var(--ink); color:var(--graphite);
    border-radius:7px; padding:7px 14px; font-size:13px; font-weight:700;}
  .pdfbar button:disabled{opacity:.4; cursor:not-allowed;}
  .pdfcount{font-size:13px; color:var(--ink); min-width:110px; text-align:center;}
  .pdfstage{display:flex; justify-content:center; padding:18px; background:var(--sand); min-height:300px;}
  #pdfcanvas{max-width:100%; height:auto; box-shadow:0 3px 14px rgba(30,30,30,.12); background:var(--white);}
  .pdferr{padding:40px; color:var(--ink); font-size:14px; text-align:center;}

  .stage-foot{display:flex; align-items:center; gap:14px; margin-top:22px; flex-wrap:wrap;}

  /* Finder */
  .finder{border:1px solid var(--ivory); border-radius:14px; background:var(--white); overflow:hidden; position:sticky; top:82px;}
  .finder-head{width:100%; display:flex; align-items:center; gap:14px; text-align:left; background:none; border:none; padding:16px 18px;}
  .finder-head:hover{background:var(--paper);}
  .fh-txt{display:flex; flex-direction:column; flex:1;}
  .fh-title{font-size:14.5px; font-weight:700;} .fh-sub{font-size:12.5px; color:var(--ink); margin-top:2px;}
  .finder .chev{font-size:13px; color:var(--ink);}
  .finder-body{display:none; padding:2px 18px 18px; border-top:1px solid var(--ivory);} .finder.open .finder-body{display:block;}
  .cgroup{padding:14px 0; border-bottom:1px solid var(--ivory);} .cgroup:last-child{border-bottom:none;}
  .clabel{display:block; font-size:12px; color:var(--ink); margin-bottom:10px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font-size:13px; color:var(--graphite); background:var(--white); border:1px solid var(--ivory); border-radius:999px; padding:7px 14px;}
  .chip:hover{border-color:var(--blue); color:var(--blue);}
  .chip.active{border-color:var(--blue); color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue);}

  /* Completion */
  .done-wrap{max-width:660px; margin:64px auto; text-align:center; background:var(--white); border:1px solid var(--ivory); border-radius:14px; padding:48px 44px;}
  .done-wrap .check{width:60px; height:60px; border-radius:50%; background:var(--ink); color:var(--white); display:grid; place-items:center; margin:0 auto 20px; font-size:28px;}
  .done-wrap h2{font-size:28px; margin:0 0 12px;} .done-wrap p{color:var(--ink); margin:0 auto 24px; max-width:48ch; font-size:15.5px;}
  .next-cards{display:grid; grid-template-columns:1fr 1fr; gap:14px; text-align:left; margin:26px 0 30px;}
  .next-cards .nc{border:1px solid var(--ivory); border-radius:10px; padding:16px 18px;}
  .next-cards .nc .h{font-weight:700; font-size:14.5px; margin:0 0 4px;} .next-cards .nc .d{font-size:13px; color:var(--ink); margin:0;}
  .switch{margin-top:16px; font-size:13px; background:none; border:none; color:var(--blue); padding:0;} .switch:hover{text-decoration:underline;}

  @media (max-width:1024px){
    .journey{grid-template-columns:1fr; gap:26px;}
    .rail,.finder{position:static;}
    .cards{grid-template-columns:1fr;}
    .next-cards{grid-template-columns:1fr;}
    .landing h1{font-size:30px;}
    .stage{padding:28px 24px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  :focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  /* ---- Draft 0.2 ---- */
  .brand img.mark{height:30px; width:auto; display:block; padding-right:14px; border-right:1px solid var(--ivory);}
  .top-switch{font-size:13px; color:var(--blue); font-weight:700; text-decoration:none; margin-left:12px;}
  body[data-screen="gate"] .top-switch, body[data-screen="landing"] .top-switch{display:none;}

  .journey{gap:32px;}
  .stage{padding:34px 30px;}
  .pdfstage{padding:10px;}
  .cards{grid-template-columns:repeat(auto-fit,minmax(272px,1fr));}

  .doc-tools{display:flex; gap:10px; align-items:center; margin:4px 0 12px; flex-wrap:wrap;}
  .doc-tools .dt{background:var(--white); border:1px solid var(--ink); color:var(--graphite);
    border-radius:8px; padding:8px 15px; font-size:13px; font-weight:700; text-decoration:none; display:inline-block;}
  .doc-tools .dt.primary{border-color:var(--blue); color:var(--blue);}

  .journey.expanded{grid-template-columns:minmax(0,1fr);}
  .journey.expanded .rail, .journey.expanded .finder{display:none;}

  .lock-note{margin:16px 0 0; padding:14px 17px; background:var(--paper); border:1px solid var(--ivory);
    border-left:3px solid var(--orange); border-radius:10px; font-size:13.5px; color:var(--ink);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}

  .resume{display:flex; gap:13px; align-items:center; flex-wrap:wrap; margin:0 0 22px; padding:15px 18px;
    background:var(--sand); border:1px solid var(--ivory); border-radius:12px; font-size:14px; color:var(--graphite);}
  .resume .rtxt{flex:1 1 260px;}
  .resume .ra{background:var(--blue); color:var(--white); border:none; border-radius:7px; padding:8px 16px; font-size:13px; font-weight:700;}
  .resume .rb{background:transparent; border:1px solid var(--ink); color:var(--graphite); border-radius:7px;
    padding:8px 16px; font-size:13px; font-weight:700;}

  .soon{text-align:center; padding:60px 30px 66px;}
  .soon img{height:40px; width:auto; margin:0 0 26px;}
  .soon .tag{display:inline-block; background:var(--graphite); color:var(--white); font-size:12px; font-weight:700;
    padding:6px 15px; border-radius:999px; margin:0 0 20px;}
  .soon h3{font-family:var(--serif); font-weight:400; letter-spacing:-0.02em; font-size:26px; margin:0 0 14px;}
  .soon p{max-width:58ch; margin:0 auto 14px; color:var(--ink); font-size:15px;}

  .quiz{margin:2px 0 0;}
  .q{border:1px solid var(--ivory); border-radius:12px; padding:20px 22px; margin:0 0 16px; background:var(--white);}
  .q .qt{font-size:15.5px; font-weight:700; margin:0 0 14px; color:var(--graphite);}
  .q .opt{display:flex; gap:11px; align-items:flex-start; padding:11px 14px; border:1px solid var(--ivory);
    border-radius:9px; margin:0 0 8px; cursor:pointer; font-size:14.5px; color:var(--ink); background:var(--white);}
  .q .opt:hover{background:var(--paper);}
  .q .opt input{margin:3px 0 0; flex:0 0 auto;}
  .q.marked .opt{cursor:default;}
  .q.marked .opt:hover{background:var(--white);}
  .q .opt.correct{border-color:var(--graphite); border-width:2px; background:var(--sand); color:var(--graphite);}
  .q .opt.wrong{border-color:var(--orange); border-width:2px; background:var(--paper); color:var(--graphite);}
  .q .mk{flex:0 0 auto; font-weight:700; width:16px;}
  .q .verdict{font-size:13.5px; margin:13px 0 0; line-height:1.55;}
  .q .verdict b{display:block;}
  .q .verdict b{color:var(--graphite);}
  .quiz-foot{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin:18px 0 0;}
  .qcount{font-size:13px; color:var(--ink);}
  .score{padding:18px 20px; border-radius:12px; margin:0 0 20px; font-size:14.5px; line-height:1.55;}
  .score.pass{background:var(--sand); border:1px solid var(--graphite);}
  .score.fail{background:var(--paper); border:1px solid var(--ivory);}
  .score strong{display:block; font-family:var(--serif); font-weight:400; letter-spacing:-0.02em;
    font-size:21px; margin:0 0 7px; color:var(--graphite);}

  .seealso{margin:22px 0 0; padding:18px 20px; background:var(--paper);
    border:1px solid var(--ivory); border-radius:12px;}
  .seealso .salabel{font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink); margin:0 0 12px;}
  .seealso ul{list-style:none; margin:0; padding:0;}
  .seealso li{margin:0 0 13px;}
  .seealso li:last-child{margin-bottom:0;}
  .seealso a{color:var(--blue); font-weight:700; font-size:14.5px; text-decoration:none; display:inline-block;}
  .seealso a:hover{text-decoration:underline;}
  .seealso a:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:3px;}
  .seealso .ext{font-weight:400;}
  .seealso .sad{display:block; font-size:13.5px; color:var(--ink); margin:3px 0 0; line-height:1.5;}

  .gate-grid{display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:start;}
  .gate-about{padding:8px 0 0;}
  .gate-about h2{font-size:27px; margin:0 0 16px; max-width:20ch;}
  .gate-about p{font-size:15px; color:var(--ink); margin:0 0 14px; max-width:52ch; line-height:1.6;}
  .gate-about .wl{font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--ink); margin:22px 0 10px; font-family:var(--sans);}
  .gate-about ul{margin:0; padding:0 0 0 20px; font-size:14.5px; color:var(--ink); line-height:1.7;}
  @media (max-width:900px){ .gate-grid{grid-template-columns:1fr; gap:26px;} }

  .callout{background:var(--sand); border-left:3px solid var(--orange); border-radius:8px;
    padding:15px 17px; margin:16px 0 0; font-size:13.5px; color:var(--graphite); line-height:1.55;}
  .callout .cl{display:block; font-weight:700; margin:0 0 5px;}

  .resgrid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:4px 0 22px;}
  @media (max-width:900px){ .resgrid{grid-template-columns:1fr;} }
  .rescard{background:var(--paper); border:1px solid var(--ivory); border-radius:12px; padding:20px 22px;}
  .rescard h4{font-size:16px; margin:0 0 10px;}
  .rescard p{font-size:14px; color:var(--ink); margin:0 0 12px; line-height:1.55;}
  .rescard .rsub{font-size:13px;}
  .rescard .dt{background:var(--white); border:1px solid var(--blue); color:var(--blue);
    border-radius:8px; padding:9px 15px; font-size:13.5px; font-weight:700; text-decoration:none; display:inline-block;}

  .reslist{background:var(--white); border:1px solid var(--ivory); border-radius:12px; padding:20px 22px;}
  .reslist .rlabel{font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink); margin:0 0 14px;}
  .reslist ul{list-style:none; margin:0; padding:0;}
  .reslist li{margin:0 0 15px;} .reslist li:last-child{margin-bottom:0;}
  .reslist a{color:var(--blue); font-weight:700; font-size:14.5px; text-decoration:none;}
  .reslist a:hover{text-decoration:underline;}
  .reslist a:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:3px;}
  .reslist .sad{display:block; font-size:13.5px; color:var(--ink); margin:3px 0 0; line-height:1.5;}

  .certrow{margin:16px 0 0;}

  .gate-form.stack{flex-direction:column; align-items:stretch;}
  .gate-form.stack input{width:100%;}
  .gate-hint{font-size:13px; color:var(--ink); margin:16px 0 0; line-height:1.55;}
  .field-hint{font-size:12.5px; color:var(--ink); margin:-2px 0 2px; line-height:1.5;}
  .gate-warn{color:var(--graphite); background:var(--sand); border-left:3px solid var(--orange);
    border-radius:8px; padding:12px 15px; font-size:13px; margin:12px 0 0; display:none;}
  .gate-warn.show{display:block;}
</style>
</head>
<body data-screen="gate">
  <div class="testbar" id="testbar">Testing environment. Do not enter a real email address. Use a placeholder such as fakename@email.com.</div>
  <header class="topbar">
    <div class="inner">
      <div class="brand">
        <img class="mark" src="assets/elsevier-logo-graphite.svg" alt="Elsevier" />

  function stateUrl(role){

    fetch(stateUrl(state.role),{method:"PUT",headers:{"Authorization":AUTH,"Content-Type":"application/json",

  function sendStatement(stmt){
    return fetch(LRS.endpoint+"statements",{method:"POST",headers:{"Authorization":AUTH,"Content-Type":"application/json","X-Experience-API-Version":"1.0.3"},body:JSON.stringify(stmt)})
      .then(function(r){return r.ok;}).catch(function(){
        var p=new URLSearchParams(); p.set("method","POST"); p.set("Authorization",AUTH); p.set("X-Experience-API-Version","1.0.3"); p.set("Content-Type","application/json"); p.set("content",JSON.stringify(stmt));
        return fetch(LRS.endpoint+"statements",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()}).then(function(r2){return r2.ok;}).catch(function(){return false;});
      });
  }

  /* ---- PDF.js paginated viewer ---- */
  var pdfLib=null, pdfDoc=null, pdfPage=1, pdfTotal=0, pdfReqUrl=null, pdfTask=null;
  var SS=3, MAXW=3000;
  function ensurePdfLib(){
    if(pdfLib) return Promise.resolve(pdfLib);
    return new Promise(function(res,rej){
      var s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload=function(){ pdfLib=window.pdfjsLib; pdfLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(pdfLib); };
      s.onerror=rej; document.head.appendChild(s);
    });
  }
  function setupPdf(url){
    pdfReqUrl=url; pdfDoc=null; pdfPage=1; pdfTotal=0;
    var cnt=document.getElementById("pdfcount"); if(cnt) cnt.textContent="Loading";
    ensurePdfLib().then(function(lib){ return lib.getDocument(url).promise; }).then(function(doc){
      if(pdfReqUrl!==url) return;
      pdfDoc=doc; pdfTotal=doc.numPages;
      pdfPage=(state.pdfPageWanted && state.pdfPageWanted<=pdfTotal) ? state.pdfPageWanted : 1;
      state.pdfPageWanted=null; renderPdfPage();
    }).catch(function(){
      var stage=document.getElementById("pdfstage");
      if(stage) stage.innerHTML='<div class="pdferr">This document could not be displayed inline here. <a href="'+url+'" target="_blank" rel="noopener">Open it in a new tab</a>.</div>';
      var cnt=document.getElementById("pdfcount"); if(cnt) cnt.textContent="";
    });
  }
  function renderPdfPage(){
    if(!pdfDoc) return;
    var canvas=document.getElementById("pdfcanvas"), stage=document.getElementById("pdfstage"), cnt=document.getElementById("pdfcount");
    if(!canvas||!stage) return;
    if(pdfTask){ try{ pdfTask.cancel(); }catch(e){} pdfTask=null; }
    pdfDoc.getPage(pdfPage).then(function(page){
      var avail=stage.clientWidth-20; if(avail<280) avail=280;
      var base=page.getViewport({scale:1});
      var cssScale=avail/base.width;
      var rs=cssScale*SS;
      if(base.width*rs>MAXW) rs=MAXW/base.width;
      var vp=page.getViewport({scale:rs});
      var ctx=canvas.getContext("2d");
      canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
      canvas.style.width=Math.floor(base.width*cssScale)+"px";
      canvas.style.height=Math.floor(base.height*cssScale)+"px";
      ctx.setTransform(1,0,0,1,0,0);
      pdfTask=page.render({canvasContext:ctx, viewport:vp});
      pdfTask.promise.then(function(){ pdfTask=null; }).catch(function(){});
      if(cnt) cnt.textContent="Page "+pdfPage+" of "+pdfTotal;
      var pv=document.getElementById("pdfprev"), nx=document.getElementById("pdfnext");
      if(pv) pv.disabled=(pdfPage<=1); if(nx) nx.disabled=(pdfPage>=pdfTotal);
    });
  }

  function journey(){
    var j=journeys[state.role], steps=j.steps, total=steps.length, s=steps[state.idx];
    if(s.type==="soon") return soonScreen(s);

    var dc=steps.filter(function(x){return state.done[key(x)];}).length, pct=Math.round((dc/total)*100);
    var rail='<aside class="rail"><p class="rtitle">'+j.label+'</p><p class="rmeta">'+dc+' of '+total+' complete</p>'+
      '<div class="bar"><span style="width:'+pct+'%"></span></div><ul class="steps">'+
      steps.map(function(x,i){ var cls=(i===state.idx?"active ":"")+(state.done[key(x)]?"done":"");
        return '<li class="'+cls+'" data-action="goto-step" data-idx="'+i+'" tabindex="0" role="button"><span class="num">'+(state.done[key(x)]?"\u2713":(i+1))+'</span><span class="stxt">'+x.title+'</span></li>'; }).join("")+
      '</ul><button class="switch" data-action="restart">Switch path</button></aside>';

    var isFirst=state.idx===0, isLast=state.idx===total-1;
    var remaining=steps.filter(function(x,i){ return i!==state.idx && !state.done[key(x)]; }).length;
    var quizOpen = (s.type==="quiz" && !state.done[key(s)]);
    var locked = isLast && (remaining>0 || quizOpen);

    var tools = (s.embed && s.embed.kind==="pdf") ?
      '<div class="doc-tools">'+
      '<button class="dt primary" data-action="toggle-expand">'+(state.expanded?"Exit full size":"View full size")+'</button>'+
      (s.guide?'<a class="dt" data-action="open-guide" data-guide="'+s.guide+'" href="'+s.guide+'" target="_blank" rel="noopener">Download this guide</a>':'')+
      '</div>' : '';

    var lockNote = locked ? '<p class="lock-note">'+(quizOpen && remaining===0
      ? 'Pass the knowledge check to finish this path.'
      : 'Finish path unlocks once every step is marked done. You have '+remaining+' step'+(remaining===1?"":"s")+' left'+(quizOpen?', and the knowledge check still to pass':'')+'. Use the path list on the left to pick them up.')+'</p>' : '';

    var label = isLast ? "Finish path" : (s.type==="quiz" ? "Continue" : "Mark done and continue");
    var footBtn = '<button class="btn-primary" data-action="next"'+((locked||(s.type==="quiz"&&!isLast&&quizOpen))?" disabled":"")+'>'+label+'</button>';

    var stage='<section class="stage">'+resumeBanner()+'<p class="eyebrow">Step '+(state.idx+1)+' of '+total+'</p><h2>'+s.title+'</h2>'+
      '<div class="section-body">'+(s.body||"")+'</div>'+ tools + (s.type==="quiz"?quizBlock():s.type==="resources"?resourcesScreen():media(s))+ seeAlso(s)+
      '<div class="stage-foot"><button class="btn-ghost" data-action="prev"'+(isFirst?" disabled":"")+'>Previous</button>'+
      footBtn+'</div>'+lockNote+'</section>';

    return '<div class="jwrap"><div class="journey'+(state.expanded?" expanded":"")+'">'+rail+stage+finder(steps)+'</div></div>';
  }

  function quizScore(){ var n=0; QUIZ.forEach(function(q,i){ if(state.answers[i]===q.a) n++; }); return n; }
  function quizPassed(){ return quizScore()/QUIZ.length >= PASS; }

  function quizBlock(){
    var sub=state.quizSubmitted;
    var body=QUIZ.map(function(q,qi){
      var chosen=state.answers[qi], ok=(chosen===q.a);
      var opts=q.opts.map(function(o,oi){
        var cls="opt";
        var mk="";
        if(sub){
          if(oi===q.a){ cls+=" correct"; mk='<span class="mk" aria-hidden="true">\u2713</span>'; }
          else if(oi===chosen){ cls+=" wrong"; mk='<span class="mk" aria-hidden="true">\u2717</span>'; }
          else mk='<span class="mk" aria-hidden="true"></span>';
        }
        return '<label class="'+cls+'"><input type="radio" name="q'+qi+'" data-action="answer" data-q="'+qi+'" data-o="'+oi+'"'+
          (chosen===oi?" checked":"")+(sub?" disabled":"")+' />'+mk+'<span>'+o+'</span></label>';
      }).join("");
      var verdict = sub ? '<p class="verdict '+(ok?"ok":"no")+'"><b>'+(ok?"Correct":"Not quite")+'</b>'+q.why+'</p>' : '';
      return '<div class="q'+(sub?" marked":"")+'"><p class="qt">'+(qi+1)+'. '+q.q+'</p>'+opts+verdict+'</div>';
    }).join("");

    var head="";
    if(sub){
      var sc=quizScore(), pc=Math.round(sc/QUIZ.length*100), passed=quizPassed();
      head='<div class="score '+(passed?"pass":"fail")+'"><strong>'+(passed?"You have completed the assessment":"Not passed yet")+'</strong>'+
        'You answered '+sc+' of '+QUIZ.length+' correctly, which is '+pc+' percent. A score of 75 percent or higher is required to pass.'+
        (passed?'':' Read the feedback below and try again.')+
        (passed?'<div class="certrow"><button class="btn-primary" data-action="print-cert">Click to Print Certificate</button></div>':'')+'</div>';
    }
    var foot = sub
      ? (quizPassed() ? '' : '<div class="quiz-foot"><button class="btn-primary" data-action="quiz-retry">Try again</button></div>')
      : '<div class="quiz-foot"><button class="btn-primary" data-action="quiz-submit">Submit answers</button>'+
        '<span class="qcount" id="qcount">'+Object.keys(state.answers).length+' of '+QUIZ.length+' answered</span></div>';
    return '<div class="quiz">'+head+body+foot+'</div>';
  }

  function handle(action, el){
    if(action==="submit-email"){
      var i=document.getElementById("gate-email"), v=i?i.value.trim():"", at=v.indexOf("@"), dot=v.lastIndexOf(".");
      var o=document.getElementById("gate-org"), ov=o?o.value.trim():"";
      var errEl=document.getElementById("gate-err"), warnEl=document.getElementById("gate-orgwarn");
      if(!(at>0 && dot>at+1 && dot<v.length-1) || ov.length<2){ if(errEl) errEl.classList.add("show"); return; }
      if(errEl) errEl.classList.remove("show");
      var looksAbbrev = ov.length<=6 && ov.indexOf(" ")===-1 && ov===ov.toUpperCase() && /[A-Z]/.test(ov);
      if(looksAbbrev && state.orgWarned!==ov){ state.orgWarned=ov; if(warnEl) warnEl.classList.add("show"); return; }
      state.email=v; state.org=ov; state.screen="landing";
      xapi(VERBS.initialized, activity("hub","Onboarding and Enablement Hub")); render(); return;
    }
    if(action==="choose-role"){
      state.role=el.getAttribute("data-role"); state.idx=0; state.done={}; state.answers={};
      state.quizSubmitted=false; state.expanded=false; state.resumeOffer=null; state.screen="journey";
      xapi(VERBS.selected, activity("path/"+state.role, journeys[state.role].label));
      render();
      var want=state.role;
      loadProgress(want, function(d){
        if(!d || state.role!==want || state.screen!=="journey") return;
        if(d.done && Object.keys(d.done).length){ state.resumeOffer=d; render(); }
      });
      return;
    }
    if(action==="resume-yes"){
      var rd=state.resumeOffer||{}, tot=journeys[state.role].steps.length;
      state.done=rd.done||{}; state.answers=rd.answers||{}; state.quizSubmitted=!!rd.quizSubmitted;
      state.idx=Math.min(typeof rd.idx==="number"?rd.idx:0, tot-1);
      state.resumeOffer=null; render(); return;
    }
    if(action==="resume-no"){ state.resumeOffer=null; saveProgress(); render(); return; }
    if(action==="goto-step"){ state.idx=parseInt(el.getAttribute("data-idx"),10); state.expanded=false;
      var gs=journeys[state.role].steps[state.idx]; xapi(VERBS.experienced, activity("path/"+state.role+"/step/"+key(gs), gs.title)); render(); return; }
    if(action==="toggle-expand"){ state.expanded=!state.expanded; state.pdfPageWanted=pdfPage; render(); return; }
    if(action==="answer"){
      state.answers[parseInt(el.getAttribute("data-q"),10)]=parseInt(el.getAttribute("data-o"),10);
      var qc=document.getElementById("qcount");
      if(qc) qc.textContent=Object.keys(state.answers).length+" of "+QUIZ.length+" answered";
      return;
    }
    if(action==="quiz-submit"){
      if(Object.keys(state.answers).length<QUIZ.length){
        var qc2=document.getElementById("qcount");
        if(qc2) qc2.textContent="Answer all "+QUIZ.length+" questions before submitting";
        return;
      }
      state.quizSubmitted=true;
      var qs=journeys[state.role].steps[state.idx], sc=quizScore(), passed=quizPassed();
      QUIZ.forEach(function(q,qi){
        xapi(VERBS.answered, activity("path/"+state.role+"/quiz/q"+(qi+1), "Question "+(qi+1)),
          {success:state.answers[qi]===q.a, response:String(state.answers[qi])});
      });
      xapi(passed?VERBS.passed:VERBS.failed, activity("path/"+state.role+"/quiz","Knowledge check"),
        {score:{scaled:sc/QUIZ.length, raw:sc, min:0, max:QUIZ.length}, success:passed, completion:true});
      if(passed) state.done[key(qs)]=true;
      saveProgress(); render(); return;
    }
    if(action==="print-cert"){ return; }
    if(action==="quiz-retry"){ state.quizSubmitted=false; state.answers={}; render(); return; }
    if(action==="next"){
      var steps=journeys[state.role].steps, total=steps.length, d=steps[state.idx];
      var left=steps.filter(function(x,ix){ return ix!==state.idx && !state.done[key(x)]; }).length;
      if(d.type!=="quiz"){
        state.done[key(d)]=true;
        xapi(VERBS.completed, activity("path/"+state.role+"/step/"+key(d), d.title));
      }
      if(state.idx<total-1){ state.idx++; state.expanded=false; saveProgress(); render(); }
      else {
        if(left>0 || (d.type==="quiz" && !state.done[key(d)])) return;
        state.screen="done"; saveProgress();
        xapi(VERBS.completed, activity("path/"+state.role, journeys[state.role].label)); render();
      }
      return;
    }
    if(action==="prev"){ if(state.idx>0){ state.idx--; state.expanded=false; render(); } return; }
    if(action==="restart"){ state.screen="landing"; state.role=null; state.idx=0; state.done={};
      state.answers={}; state.quizSubmitted=false; state.expanded=false; state.resumeOffer=null; render(); return; }
    if(action==="toggle-index"){ state.indexOpen=!state.indexOpen; render(); return; }
    if(action==="pdf-prev"){ if(pdfDoc && pdfPage>1){ pdfPage--; renderPdfPage(); } return; }
    if(action==="pdf-next"){ if(pdfDoc && pdfPage<pdfTotal){ pdfPage++; renderPdfPage(); } return; }
    if(action==="open-resource"){
      var ru=el.getAttribute("data-res"), rt=el.getAttribute("data-restitle")||"";
      xapi(VERBS.experienced, activity("resource/"+slug(rt), "See also: "+rt));
      window.open(ru,"_blank","noopener"); return;
    }
    if(action==="open-guide"){
      var url=el.getAttribute("data-guide"), ds=journeys[state.role]?journeys[state.role].steps[state.idx]:null;
      xapi(VERBS.downloaded, activity("guide/"+(ds?slug(ds.title):"item"), "Guide: "+(ds?ds.title:"")));
      window.open(url,"_blank","noopener"); return;
    }
  }

  if(!TESTING){
    var tb=document.getElementById("testbar"); if(tb) tb.style.display="none";
    var lb=document.getElementById("lrs-badge"); if(lb) lb.style.display="none";
    document.body.setAttribute("data-testing","off");
  }

  document.addEventListener("click", function(e){ var el=e.target.closest("[data-action]"); if(!el) return;
    if(!(el.tagName==="INPUT" && el.type==="radio")) e.preventDefault();
    handle(el.getAttribute("data-action"), el); });
  document.addEventListener("keydown", function(e){ if((e.key==="Enter"||e.key===" ") && e.target.matches('.steps li[data-action]')){ e.preventDefault(); handle("goto-step", e.target); } });
  var rz; window.addEventListener("resize", function(){ clearTimeout(rz); rz=setTimeout(function(){ if(pdfDoc && state.screen==="journey"){ var cs=journeys[state.role].steps[state.idx]; if(cs.embed&&cs.embed.kind==="pdf") renderPdfPage(); } },150); });

  render();
})();
</script>
</body>
</html>
